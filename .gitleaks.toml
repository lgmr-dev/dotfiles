[extend]
useDefault = true

[[rules]]
id = "home-folder-path"
description = "A path in a user home folder"
regex = '''(^|[^A-Za-z0-9._~-])(/Users/|/home/|/root/|[A-Za-z]:\\{1,2}Users\\{1,2})[A-Za-z0-9._-]+'''

[[rules.allowlists]]
description = "The synthetic home folders of tests, fixtures and CI runners"
regexTarget = "match"
regexes = ['''[/\\](user|bob|runner|dotfiles-migration)$''']
