[extend]
useDefault = true

[[rules]]
id = "home-folder-path"
description = "A path in a user home folder"
regex = '''((?i:https?)://(\[[0-9A-Fa-f:.]+\]|[^/\s"',;<>()|`\\{}\[\]]+)([^\s"',;<>()|`\\{}\[\]]|\([^\s"',;<>()|`\\{}\[\]]*\))*)?([a-zA-Z]:)?(/|\\{1,2})((?i:users)|home|root)(/|\\{1,2})([\p{L}\p{N}._-]|%[0-9A-Fa-f]{2})+'''

[[rules.allowlists]]
description = "The synthetic home folders of tests, fixtures and CI runners"
regexTarget = "match"
regexes = ['''(?i)[/\\](user|bob|runner|runneradmin|dotfiles-migration)\.*$''']

[[rules.allowlists]]
description = "The shared and public system folders"
regexTarget = "match"
regexes = ['''(?i)[/\\]users[/\\]{1,2}(shared|public|default)\.*$''']

[[rules.allowlists]]
description = "A web URL with a home-like path"
regexTarget = "match"
regexes = ['''^(?i:https?)://[^/]''']
