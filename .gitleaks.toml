[extend]
useDefault = true

[[rules]]
id = "home-folder-path"
description = "A path in a user home folder"
regex = '''(https?://[^/\s"',;<>()\\]+[^\s"',;<>()\\]*)?(/(?i:users)/|/home/|/root/|([a-zA-Z]:)?\\{1,2}(?i:users)\\{1,2})[\p{L}\p{N}._-]+'''

[[rules.allowlists]]
description = "The synthetic home folders of tests, fixtures and CI runners"
regexTarget = "match"
regexes = ['''(?i)[/\\](user|bob|runner|dotfiles-migration)$''']

[[rules.allowlists]]
description = "A web URL with a home-like path"
regexTarget = "match"
regexes = ['''^https?://[^/]''']
